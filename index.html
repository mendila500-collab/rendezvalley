<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rendez Valley — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-orange: #e8891a;
    --brand-brown: #5a2e12;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Poppins', sans-serif;
  }

  body {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #fff;
    background-color: #1a1a1a;
    background-image: url('assets/background.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden;
  }

  /* subtle dark overlay so text stays readable, same as original */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.15);
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem;
    max-width: 700px;
  }

  .logo {
    width: 180px;
    max-width: 60vw;
    margin-bottom: 1.5rem;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
  }

  h1.coming-soon {
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    color: var(--brand-orange);
    font-size: clamp(2.5rem, 7vw, 5rem);
    text-shadow: 0 3px 12px rgba(0,0,0,0.5);
    margin-bottom: 0.5rem;
  }

  p.subtext {
    font-family: 'Dancing Script', cursive;
    font-weight: 600;
    font-size: clamp(1.3rem, 3vw, 1.8rem);
    color: #f5f5f5;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    margin-bottom: 2rem;
  }

  a.cta-button {
    display: inline-block;
    background: var(--brand-orange);
    color: #ffffff;
    font-weight: 700;
    letter-spacing: 1px;
    text-decoration: none;
    padding: 1rem 2.8rem;
    border-radius: 4px;
    font-size: 1.1rem;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    transition: transform 0.2s ease, background 0.2s ease;
  }

  a.cta-button:hover {
    background: #d67d10;
    transform: translateY(-2px);
  }

  @media (max-width: 480px) {
    .content { padding: 1.2rem; }
    a.cta-button { padding: 0.9rem 2rem; font-size: 1rem; }
  }
</style>
</head>
<body>

  <div class="content">
    <img class="logo" src="assets/logo.png" alt="Rendez Valley Logo">

    <h1 class="coming-soon">Coming Soon....</h1>
    <p class="subtext">Be the first to know.</p>

    <a class="cta-button" href="https://www.instagram.com/rendez_valley/?hl=en" target="_blank" rel="noopener noreferrer">
      CLICK HERE
    </a>
  </div>

</body>
</html>
